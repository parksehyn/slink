[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slink-cli"
version = "0.2.0"
description = "Solid-Link CLI — SOLID VM에서 Colab GPU 연결"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "shyun2e", email = "dhaprk0429@dankook.ac.kr" }]
keywords = ["jupyter", "colab", "gpu", "remote-kernel"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/parksehyn/slink"

[project.scripts]
slink = "slink:main"

[tool.setuptools]
py-modules = ["slink"]
