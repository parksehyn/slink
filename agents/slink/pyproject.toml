[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slink-cli"
version = "0.1.0"
description = "Solid-Link CLI — SOLID VM에서 Colab GPU 연결"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.scripts]
slink = "slink:main"

[tool.setuptools]
py-modules = ["slink"]
