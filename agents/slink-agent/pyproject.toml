[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slink-agent"
version = "0.2.0"
description = "Solid-Link 외부 자원 연결 에이전트 (Colab GPU / Jupyter / HTTP·API)"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "jupyterlab>=4.0",
]

[project.scripts]
slink-agent = "slink_agent.agent:main"
slink-resource = "slink_agent.agent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["slink_agent*"]
