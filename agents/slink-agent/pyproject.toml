[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slink-agent"
version = "0.1.0"
description = "Solid-Link Colab GPU 에이전트"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "pyngrok>=7.0",
    "jupyterlab>=4.0",
]

[project.scripts]
slink-agent = "slink_agent.agent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["slink_agent*"]
