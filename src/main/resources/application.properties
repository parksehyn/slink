spring.application.name=slink-relay
server.port=${PORT:8081}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ── DNS 서비스 (DNS Server VM) ────────────────────────────────────────────────
# 아래 키를 설정하면 실제 동작으로 전환된다. 미설정 시 Mock(데모/테스트)으로 동작.
#
# DNS 레코드 파일 영속(미설정 시 인메모리):
# dns.store.file=/var/lib/slink/dns-records.json
#
# CoreDNS zone 파일 직접 반영(미설정 시 MockDnsProvider=로그만):
# dns.zone.file=/etc/coredns/db.solid.internal
# dns.zone.name=solid.internal
# dns.zone.ns-ip=10.0.10.10
#
# 실제 CloudStack 연동(미설정 시 MockCloudStackProvider=임의 자격·샘플 VM):
# cloudstack.api.url=https://dku.kloud.zone/client/api
