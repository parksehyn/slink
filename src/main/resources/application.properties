spring.application.name=slink-relay
server.port=${PORT:8081}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ── DNS 서비스 (DNS Server VM) ────────────────────────────────────────────────
# 아래 키를 설정하면 실제 동작으로 전환된다. 미설정 시 Mock(데모/테스트)으로 동작.
#
# DNS 레코드 파일 영속(미설정 시 인메모리):
# dns.store.file=/var/lib/slink/dns-records.json
#
# CoreDNS zone 파일 직접 반영(미설정 시 MockDnsProvider=로그만):
# dns.zone.file=/etc/coredns/db.solid.internal
# dns.zone.name=solid.internal
# dns.zone.ns-ip=10.0.10.10
#
# 실제 CloudStack 연동(미설정 시 MockCloudStackProvider=임의 자격·샘플 VM):
# cloudstack.api.url=https://dku.kloud.zone/client/api
#
# 자체 구현 DNS 응답기(UDP 권한 서버, 직접 구현 — unified-agent-design.md §9).
# 켜면 DnsRecordRegistry를 zone 데이터로 직접 서빙(CoreDNS 불필요). 기본 꺼짐:
# dns.server.enabled=true
# dns.server.port=53
# 존 밖 질의를 전달할 상위 DNS(스텁 포워딩). 미설정 시 존 밖 질의는 REFUSED:
# dns.server.upstream=8.8.8.8
# 응답 처리 워커 수(수신 루프와 분리 — 포워딩 지연이 존 내 응답을 막지 않게). 기본 4:
# dns.server.workers=4

# ── 전역 유일 이름 정책 보완 (멀티유저 안전장치) ─────────────────────────────────
# 아래는 모두 기본값으로도 동작한다. 미팅 후 수치만 바꾸면 됨.
#
# 시스템 예약 이름(선점 차단, 콤마 구분). 첫 라벨이 목록에 있으면 RESERVED_NAME(400):
# dns.reserved-names=ns,ns1,ns2,www,mail,smtp,dns,coredns,localhost,gateway,admin,root
#
# 소유자(학번) 1인당 레코드 개수 상한. 초과 시 RECORD_LIMIT_EXCEEDED(429). 0=무제한:
# dns.max-records-per-owner=20
#
# 방치 레코드 자동 회수: 마지막 갱신 후 N일 지난 레코드 삭제(1시간 주기). 0=비활성:
# dns.record.expire-days=0

# ── 터널링/서비스 영속 (Relay VM) ──────────────────────────────────────────────
# 미설정 시 인메모리(재시작 시 유실). Relay를 SOLID VM(디스크 영속)에 올릴 때 설정하면
# 서비스·아웃바운드 연결·VM Agent 등록(at- 토큰)이 재시작·재부팅에도 보존된다.
# service.store.file=/var/lib/slink/services.json
# connection.store.file=/var/lib/slink/connections.json
# agent.store.file=/var/lib/slink/agents.json

# ── 학생당 서비스 제한 (멀티유저 안전장치) ──────────────────────────────────────
# 소유자(학번) 1인당 서비스 개수 상한. 초과 시 400. 0=무제한:
# service.max-per-owner=10
# 소유자 1인당 동시 공개(PUBLIC/대기) 서비스 상한. 초과 시 400. 0=무제한:
# service.max-public-per-owner=3

# ── 외부 자원 연결 (아웃바운드, 에이전트 기반) ──────────────────────────────────
# 외부 자원(Colab/Jupyter/HTTP) 영속(미설정 시 인메모리, 재시작 시 유실):
# resource.store.file=/var/lib/slink/resources.json
# 외부 에이전트용 단기 등록 토큰(rt-) 수명(분). 기본 10:
# resource.registration-token.ttl-minutes=10
# 소유자(학번)당 외부 자원 개수 상한. 초과 시 400. 0=무제한(기본):
# resource.max-per-owner=0
